<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokefisi Battle UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="battle-shell">
    <section id="mode-screen" class="mode-screen">
      <div class="mode-card">
        <p class="mode-kicker">POKEFISI</p>
        <h1 class="mode-title">Selecciona el modo de combate</h1>
        <p class="mode-copy">Elige si deseas jugar directamente contra la IA o mirar una batalla automatica entre agentes.</p>

        <label class="field-label" for="team-size">Tamano del equipo</label>
        <select id="team-size" class="team-size-select">
          <option value="3">3 vs 3</option>
          <option value="4">4 vs 4</option>
        </select>

        <div class="mode-actions">
          <button id="start-human" class="mode-btn primary" type="button">Human vs IA</button>
          <button id="start-ai" class="mode-btn secondary" type="button">IA vs IA</button>
        </div>
      </div>
    </section>

    <section id="battle-screen" class="battle-screen">
      <div class="replay-controls">
        <button id="new-game" class="mini-btn" type="button">NEW</button>
        <button id="toggle-play" class="mini-btn" type="button">AUTO</button>
        <button id="next-frame" class="mini-btn" type="button">NEXT</button>
      </div>

      <div id="battle-status-pill" class="battle-status-pill">Esperando inicio</div>
      <div id="winner-banner" class="winner-banner hidden"></div>

      <section id="battlefield" class="battlefield">
        <div id="enemy-status" class="status-card enemy-card">
          <div class="status-topline">
            <span id="enemy-name" class="pokemon-name">ENEMY</span>
            <span id="enemy-level" class="pokemon-level">Lv50</span>
          </div>
          <div class="hp-row">
            <span class="hp-label">HP</span>
            <div class="hp-track">
              <div id="enemy-hp-fill" class="hp-fill"></div>
            </div>
          </div>
          <div class="party-row" id="enemy-party"></div>
        </div>

        <div id="enemy-sprite-wrapper" class="sprite-wrapper enemy-sprite-wrapper">
          <img id="enemy-sprite" class="battle-sprite enemy-sprite" alt="Pokemon enemigo">
        </div>

        <div id="player-sprite-wrapper" class="sprite-wrapper player-sprite-wrapper">
          <img id="player-sprite" class="battle-sprite player-sprite" alt="Pokemon del jugador">
        </div>

        <div id="player-status" class="status-card player-card">
          <div class="status-topline">
            <span id="player-name" class="pokemon-name">PLAYER</span>
            <span id="player-level" class="pokemon-level">Lv50</span>
          </div>
          <div class="hp-row">
            <span class="hp-label">HP</span>
            <div class="hp-track">
              <div id="player-hp-fill" class="hp-fill"></div>
            </div>
          </div>
          <div class="numeric-hp">
            <span id="player-hp-text">100 / 100</span>
          </div>
          <div class="party-row" id="player-party"></div>
        </div>
      </section>

      <section class="bottom-ui">
        <div class="message-box">
          <div class="message-label">MESSAGE</div>
          <div class="message-scroll">
            <p id="battle-message" class="battle-message">Cargando batalla...</p>
          </div>
        </div>

        <div class="action-panel-wrap">
          <div class="action-panel-header">
            <span id="panel-title">Opciones</span>
            <span id="panel-subtitle">Selecciona un modo para comenzar</span>
          </div>
          <div class="action-panel">
            <button class="action-btn" id="action-0" type="button">FIGHT</button>
            <button class="action-btn" id="action-1" type="button">SWITCH</button>
            <button class="action-btn" id="action-2" type="button">-</button>
            <button class="action-btn" id="action-3" type="button">-</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
